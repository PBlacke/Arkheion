<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Detailed book icon for favicon -->
  <g transform="translate(16,16)">
    <!-- Book base -->
    <path d="M-8,-6 Q-8,-8 -6,-8 L6,-8 Q8,-8 8,-6 L8,6 Q8,8 6,8 L-6,8 Q-8,8 -8,6 Z" fill="#1e3a8a" stroke="none"/>
    <!-- Center binding -->
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#ffffff" stroke-width="2"/>
    <!-- Multiple curved page lines -->
    <path d="M-6,-5 Q0,-6 6,-5" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.9"/>
    <path d="M-6,-3 Q0,-4 6,-3" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
    <path d="M-6,-1 Q0,-2 6,-1" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
    <path d="M-6,1 Q0,0 6,1" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
    <path d="M-6,3 Q0,2 6,3" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.9"/>
    <!-- Book corners for depth -->
    <path d="M-8,-6 L-6,-8" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    <path d="M8,-6 L6,-8" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  </g>
</svg>